services:
  - type: web
    name: fb-growth-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FB_PAGE_TOKEN
        sync: false
      - key: FB_PAGE_ID
        sync: false
      - key: DATABASE_URL
        sync: false
