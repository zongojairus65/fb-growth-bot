services:
  - type: web
    name: fb-growth-bot
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FB_PAGE_TOKEN
        sync: false
      - key: FB_PAGE_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 8000
